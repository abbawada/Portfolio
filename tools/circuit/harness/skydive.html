<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skydiving tile harness</title>
    <link rel="stylesheet" href="../../../circuit/circuit.css">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,600;1,700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <script>
        /* ?nocss=1 leaves circuit/skydive.css out, the way index.html does, to prove the module links it itself */
        if (!/[?&]nocss=1/.test(location.search)) document.write('<link rel="stylesheet" href="../../../circuit/skydive.css">');
    </script>
    <style>
        /* the Projects panel, stood alone: its width and padding, nothing else */
        body { background: var(--paper); color: var(--ink); font-family: var(--font-serif); }
        .harness { width: min(600px, 100vw); padding: 1.5rem clamp(1.25rem, 4vw, 2.5rem) 3rem; }
        .harness-kicker { font-family: var(--font-chrome); font-style: italic; font-weight: 600; font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
        .dummy { width: 232px; height: 348px; border-radius: 4px; background: #c9c3b7; }
        @media (max-width: 720px) { .dummy { width: 176px; height: 264px; } }
    </style>
</head>
<body>
    <main class="harness">
        <p class="harness-kicker">Harness: skydive tile in a ring-grid</p>
        <div class="ring-grid" aria-label="Project cases">
            <div id="skyHost"></div>
            <div class="dummy" aria-hidden="true"></div>
        </div>
    </main>
    <script type="module">
        import { mountSkydive } from '../../../circuit/skydive.js';
        const q = new URLSearchParams(location.search);
        window.__jumps = 0; window.__links = 0;
        const opts = {
            href: 'https://www.instagram.com/reel/Ddv8Qr_gruP/',
            compact: q.get('open') !== '1',
            onJump: () => { window.__jumps++; },
            onLink: () => { window.__links++; }
        };
        window.__sky = mountSkydive(document.getElementById('skyHost'), opts);
        /* ?two=1 mounts a second tile into the same host, for the shared-host destroy check */
        if (q.get('two') === '1') window.__sky2 = mountSkydive(document.getElementById('skyHost'), opts);
    </script>
</body>
</html>
